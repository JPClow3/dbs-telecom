version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbs-telecom-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - IXC_BASE_URL=https://demo.ixcsoft.com.br/webservice/v1
      - IXC_TOKEN=replace-with-a-rotated-ixc-token
      - AI_PROVIDER=hybrid
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
