services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbs-telecom-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the allowed production origins}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong production secret}
      IXC_BASE_URL: ${IXC_BASE_URL:?Set IXC_BASE_URL to the production IXC API URL}
      IXC_TOKEN: ${IXC_TOKEN:?Set IXC_TOKEN to the rotated production credential}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:?Set PIX_WEBHOOK_SECRET to a strong production secret}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL/Neon connection string}
      DBS_DEMO_MODE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
